<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div class="panel">
        <sp-heading size="M">Magazine Automation</sp-heading>

        <div class="section">
            <sp-label>Article</sp-label>
            <sp-button id="btnLoadArticle" variant="secondary">Load Article</sp-button>
            <sp-body id="articleFileName" size="S">article.json</sp-body>
        </div>

        <div class="section">
            <sp-button id="btnGenerate" variant="cta">Generate</sp-button>
        </div>

        <div class="section">
            <sp-button id="btnInspect" variant="secondary">Inspect Template</sp-button>
        </div>

        <div class="section">
            <sp-label>Inspection Log</sp-label>
            <pre id="inspectLog" class="log-area">(Inspect Template을 아직 실행하지 않음)</pre>
        </div>

        <div class="section">
            <sp-label>Status</sp-label>
            <sp-body id="statusText" size="S">Ready</sp-body>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
